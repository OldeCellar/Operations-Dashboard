name: Publish Vol On Hand

on:
  schedule:
    - cron: '23 * * * *'        # hourly, at 23 minutes past
  workflow_dispatch: {}          # also runnable by hand from the Actions tab

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Compute Vol On Hand
        env:
          BF_USER_ID: ${{ secrets.BF_USER_ID }}
          BF_API_KEY: ${{ secrets.BF_API_KEY }}
        run: node scripts/vol_on_hand.mjs

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add vol_on_hand.json
          if git diff --staged --quiet; then
            echo "No changes - skipping commit"
          else
            git commit -m "Vol On Hand $(TZ=America/New_York date '+%Y-%m-%d %H:%M %Z')"
            git pull --rebase origin "${{ github.ref_name }}"
            git push origin "HEAD:${{ github.ref_name }}"
          fi
